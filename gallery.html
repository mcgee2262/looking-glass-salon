<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gallery | Looking Glass Salon</title>
<meta name="description" content="Recent color and cut work by Brandie Ryan at Looking Glass Salon.">
<meta name="robots" content="noindex">
<!-- REVIEW: remove noindex, add canonical + og:image + LocalBusiness JSON-LD once domain and facts are approved. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Pinyon+Script&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="gallery">
<header id="site-header"></header>
<main id="main">
<section class="phero wrap">
<div><h1 class="rv">Brandie’s recent work</h1>
<p class="lede rv">Color, cuts and highlights by Brandie Ryan at Looking Glass Salon. Real photos from her chair.</p>
<p class="rv"><a class="btn big" data-book>Book now</a></p></div>
<figure class="pic tall rv"><img src="assets/hero/hero-blonde.jpg" width="1358" height="1800" alt="Back view of long, straight hair in soft ash and honey blonde against a wall of shelves" decoding="async"></figure>
</section>
<section class="wrap sec-h" aria-labelledby="ba-h">
<h2 id="ba-h" class="rv">Before and after</h2>
<p class="rv">Drag the line across each photo to compare.</p>
<div class="ba-row"><figure class="ba rv"><div class="ba-stage"><img class="ba-after" src="assets/ba/ba-01-after.jpg" width="534" height="1100" alt="After: long wavy brown hair with soft caramel highlights, back view" decoding="async"><img class="ba-before" src="assets/ba/ba-01-before.jpg" width="534" height="1100" alt="Before: long dark brown hair with chunky blonde streaks, back view" decoding="async"><span class="ba-tag l">Before</span><span class="ba-tag r">After</span><span class="ba-line"></span><span class="ba-knob" aria-hidden="true">&#8596;</span><input type="range" min="0" max="100" value="50" aria-label="Drag to compare before and after"></div><figcaption>Chunky blonde streaks on dark brown, then soft caramel highlights.</figcaption></figure><figure class="ba rv"><div class="ba-stage"><img class="ba-after" src="assets/ba/ba-02-after.jpg" width="534" height="1100" alt="After: long, wavy, vivid copper hair, back view" decoding="async"><img class="ba-before" src="assets/ba/ba-02-before.jpg" width="534" height="1100" alt="Before: long orange-brown hair, back view" decoding="async"><span class="ba-tag l">Before</span><span class="ba-tag r">After</span><span class="ba-line"></span><span class="ba-knob" aria-hidden="true">&#8596;</span><input type="range" min="0" max="100" value="50" aria-label="Drag to compare before and after"></div><figcaption>Dull orange-brown to bright, vivid copper.</figcaption></figure></div>
</section>
<section class="wrap" aria-label="Photos">
<div id="gchips" class="chips" role="group" aria-label="Filter photos"></div>
<div class="grid" id="gallery"></div>
</section>
<dialog id="lightbox" aria-label="Photo viewer">
<figure><img alt=""><figcaption></figcaption></figure>
<button type="button" class="close" aria-label="Close">Close</button>
<div class="nav"><button type="button" class="prev" aria-label="Previous photo">Previous</button><button type="button" class="next" aria-label="Next photo">Next</button></div>
</dialog>
</main>
<footer id="site-footer"></footer>
<script src="js/content.js"></script>
<script src="js/site.js"></script>
</body>
</html>
