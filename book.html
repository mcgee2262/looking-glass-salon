<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book | Looking Glass Salon</title>
<meta name="description" content="Preview of online booking at Looking Glass Salon.">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400..700;1,400..700&family=Jost:wght@300..700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="book">
<header id="site-header"></header>
<main id="main" class="wrap bk">
<p class="bk-demo" role="note"><strong>Preview only.</strong> Online booking is not live yet. Nothing you enter here is sent, and no appointment is made.</p>
<h1 class="bk-title">Book with Brandie</h1>
<ol class="bk-steps" aria-label="Booking steps">
  <li data-step="1">Service</li><li data-step="2">Extras</li><li data-step="3">Date &amp; time</li><li data-step="4">Your details</li><li data-step="5">Done</li>
</ol>
<div class="bk-layout">
  <section id="bk-panel" class="bk-panel" aria-live="polite"></section>
  <aside class="bk-sum" aria-label="Your appointment">
    <h2>Your appointment</h2>
    <div id="bk-sum-body"><p class="bk-muted">Pick a service to start.</p></div>
  </aside>
</div>
</main>
<footer id="site-footer"></footer>
<script src="js/content.js"></script>
<script src="js/site.js"></script>
<script src="js/book.js"></script>
</body>
</html>
